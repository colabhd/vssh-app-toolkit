name: Publish App (reusable)

# Este toolkit está arquivado: o SDK do VSSH é o repositório público `colabhd/vssh-sdk`, e é lá
# que moram o script de publicação, o contrato do manifesto e o workflow reutilizável que o CI de
# um app chama. Este arquivo continua existindo para quem ainda aponta para cá, e o que ele faz é
# repassar a chamada ao workflow de lá, com as mesmas entradas e o mesmo segredo:
#
#   jobs:
#     publish:
#       uses: colabhd/vssh-sdk/.github/workflows/_publish-app-reusable.yml@main
#       with:
#         app_dir: "."
#         repo_api: "https://vssh-repo.colabh.org"
#       secrets:
#         publish_token: ${{ secrets.VSSH_REPO_PUBLISH_TOKEN }}   # token escopado app:<id>
#
# É a linha que o `.github/workflows/publish.yml` do seu app deve passar a ter. O `@main` é
# deliberado: o schema que o publish valida é gerado a partir do portal que está no ar, e a ponta
# de `main` do vssh-sdk é a revisão que responde "o portal de hoje aceita este manifesto?". Uma tag
# deste toolkit congelaria um contrato que o portal já deixou para trás.
#
# `tools_ref` continua declarado para não quebrar um chamador que o passa, e não é repassado: a
# ref dele nomeia uma tag deste repositório (`v4`), que não existe no vssh-sdk. Quem precisar fixar
# uma revisão do SDK chama o workflow de lá diretamente, com o `tools_ref` daquele repositório.

on:
  workflow_call:
    inputs:
      app_dir:
        description: 'Diretório do app dentro do repo chamador'
        type: string
        default: '.'
      version:
        description: 'Sobrescreve a version do manifest (opcional)'
        type: string
        default: ''
      repo_api:
        description: 'Base URL do Worker do repositório'
        type: string
        required: true
      tools_ref:
        description: 'Aceito por compatibilidade, e ignorado: o script e o schema vêm de colabhd/vssh-sdk@main'
        type: string
        default: 'v4'
    secrets:
      publish_token:
        description: 'Token de publicação escopado (app:<id> ou kind:app)'
        required: true

jobs:
  publish:
    name: Publish app pelo vssh-sdk
    uses: colabhd/vssh-sdk/.github/workflows/_publish-app-reusable.yml@main
    with:
      app_dir: ${{ inputs.app_dir }}
      version: ${{ inputs.version }}
      repo_api: ${{ inputs.repo_api }}
    secrets:
      publish_token: ${{ secrets.publish_token }}
