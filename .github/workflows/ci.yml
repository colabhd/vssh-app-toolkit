name: CI

# As libs de lib/ são código compartilhado: um bug aqui se espalha para todo vssh-app que as
# vendorizar. Sem dependência npm, então não há `npm ci` — é `node --test` e pronto.
#
# ISSO CONTINUA VALENDO DEPOIS DA ONDA 3, e foi decisão consciente. Parte dos testes de lib/web/
# roda num Chrome de verdade (o `vm` do Node discorda do navegador justamente na leitura que o
# fsa-polyfill quebrava), e o instrumento é `tests/browser/chrome.js`: CDP à mão, sobre o
# `WebSocket` nativo do Node, usando um navegador JÁ INSTALADO. O runner ubuntu-latest traz Chrome,
# então não há passo de instalação nem download de ~130 MB para cachear. Sem navegador — numa
# máquina de desenvolvimento sem Chrome, por exemplo — esses testes se PULAM em vez de falharem;
# `VSSH_TEST_CHROME` aponta um caminho específico quando necessário.
#
# SÓ LINUX NO CI, DE PROPÓSITO — não é sobra de uma matriz que encolheu.
#
# O alvo de um vssh-app é sempre um servidor Linux, independente de onde o app é desenvolvido.
# Rodar a matriz em dois SOs dobrava os minutos de Actions para cobrir uma plataforma que nunca
# executa o código em produção. O que o CI precisa garantir é o alvo; ele garante.
#
# Isso NÃO quer dizer que Windows não importe: o desenvolvimento acontece nele, e a suíte tem de
# passar lá — a diferença é que quem verifica é quem desenvolve, rodando `npm test` na máquina,
# não o CI a cada push. Vale saber que essa divisão já pegou um bug de verdade: `static-spa`
# canonicalizava a raiz com `realpathSync` e o alvo com `fsp.realpath`, e só a segunda expande
# nome curto 8.3 no Windows — com o TEMP em `C:\Users\ARTHUR~1\...` as duas grafias nunca casavam
# e todo asset aninhado dava 404. Achado rodando a suíte local, consertado em
# lib/node/static-spa.js. O mesmo defeito morderia no Linux num deploy `current -> releases/N`.
#
# Antes de "restaurar" `windows-latest` aqui: a decisão é de custo, e é deliberada.

on:
  push:
    branches: [main]
    # `schema/**` entrou depois, e a falta era real: o schema é o PORTÃO DE PUBLICAÇÃO
    # (`vssh-app-publish` valida contra ele) e `tests/` o exercita — mas mexer só no schema não
    # disparava build nenhum. Um portão cuja mudança não é testada é um portão que se descobre
    # quebrado na publicação de outra pessoa.
    paths: ['lib/**', 'schema/**', 'scripts/**', 'templates/**', 'tests/**', 'package.json', '.github/workflows/ci.yml']
  pull_request:
    # `schema/**` entrou depois, e a falta era real: o schema é o PORTÃO DE PUBLICAÇÃO
    # (`vssh-app-publish` valida contra ele) e `tests/` o exercita — mas mexer só no schema não
    # disparava build nenhum. Um portão cuja mudança não é testada é um portão que se descobre
    # quebrado na publicação de outra pessoa.
    paths: ['lib/**', 'schema/**', 'scripts/**', 'templates/**', 'tests/**', 'package.json', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # ver o cabeçalho: só Linux, por custo, e o alvo é Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # O glob de `node --test` exige runner >= 22; as libs em si rodam em bem menos.
          node-version: '24'
      # Parte de lib/web/ roda num Chrome de verdade, e o cabeçalho deste arquivo afirmava que "o
      # runner ubuntu-latest traz Chrome" — afirmação que nunca foi medida aqui. Ela virou dívida
      # no dia em que o navegador não subiu: os testes falharam com um timeout que não dizia QUAL
      # binário tinha sido escolhido nem o que ele havia escrito no stderr.
      #
      # Este passo é a medição, e ele não falha o job de propósito: o que interessa é o registro,
      # ao lado do erro, na mesma página. `readlink -f` porque um `/snap/bin/*` é um invólucro com
      # confinamento próprio — ele não enxerga um `--user-data-dir` em /tmp, e o sintoma disso é
      # exatamente um processo que sobe e nunca anuncia o DevTools.
      - name: Que navegador este runner tem
        shell: bash
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium \
                   /usr/bin/chromium-browser /snap/bin/chromium /usr/bin/microsoft-edge; do
            if [ -e "$c" ]; then
              echo "$c -> $(readlink -f "$c" 2>/dev/null) :: $("$c" --version 2>&1 | head -1)"
            else
              echo "$c: ausente"
            fi
          done

      - name: Testes das libs
        shell: bash
        run: npm test

      # As libs Python e o template que as usa. Separado do `npm test` porque `node --test` não
      # sabe rodá-lo — e porque a ausência de `python3` não pode reprovar quem só mexeu em
      # JavaScript, que é a mesma regra dos testes de navegador.
      #
      # Sem `setup-python`: o `python3` do runner é o que interessa. Um app Python roda com o
      # interpretador que o SERVIDOR tem, e é justamente o do sistema — instalar uma versão nova
      # aqui mediria um Python que o alvo não tem.
      - name: Testes das libs Python
        shell: bash
        run: |
          python3 --version
          npm run test:py

  smoke-template-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24 de propósito: é o Node que os servidores-alvo tendem a ter, e o smoke existe para
          # provar que o template sobe lá. Se alguma lib usar sintaxe mais nova, aparece aqui.
          node-version: '24'
      # As libs do template vêm por npm desde a v4. Aqui elas vêm da ÁRVORE DE TRABALHO, e não da
      # tag: o smoke existe para provar que o que está neste commit sobe. Instalar `#v4` faria o
      # CI validar a versão já publicada e passar verde sobre uma quebra recém-introduzida.
      - name: Libs do template = esta árvore
        run: npm install --no-save --no-audit --no-fund "${GITHUB_WORKSPACE}"
        working-directory: templates/hello-vssh-app-node

      # Exercita o template como um app real: sobe o backend NO SOCKET que o portal daria, e
      # confere healthcheck, API, index servido pelo static-spa e SSE chegando sem buffer.
      #
      # Socket, e não porta: desde a v4 o `escutar()` só binda socket unix. Este smoke ainda
      # exportava `VSSH_APP_PORT` — o app agora morre com `VSSH_APP_SERVIDOR_ANTIGO`, e a suíte
      # unitária não pegava porque quem exercita o par lifecycle+lib é justamente este passo.
      - name: Smoke do template Node
        run: |
          cd templates/hello-vssh-app-node
          SOCK="${RUNNER_TEMP}/hwn.sock"
          # `curl --unix-socket` ignora o host da URL; ele existe só para a URL ser válida.
          #
          # ⚠ Um SCRIPT, e não uma função de shell — e a diferença derrubou este CI por quatro
          # commits. `timeout` é um binário que faz `exec` no que recebe: ele enxerga o `PATH`, e não
          # enxerga função nenhuma. `timeout 3 q …` falhava sempre com
          # `failed to run command 'q': No such file or directory`.
          #
          # O primeiro conserto trocou UMA das duas chamadas por `curl` direto e deixou a outra —
          # e o CI continuou vermelho, no mesmo erro, com a linha consertada visível no log. Por isso
          # o conserto é este: enquanto `q` for executável, toda forma de chamá-lo funciona, e não há
          # segunda chamada para esquecer.
          printf '#!/bin/sh\nexec curl --unix-socket "%s" "$@"\n' "${SOCK}" > "${RUNNER_TEMP}/q"
          chmod +x "${RUNNER_TEMP}/q"
          PATH="${RUNNER_TEMP}:${PATH}"
          VSSH_APP_SOCKET="${SOCK}" VSSH_APP_ID=hello-world-node \
            VSSH_APP_DATA_DIR="${RUNNER_TEMP}/hwn" node backend/server.js &
          for i in $(seq 1 20); do q -fsS http://app/healthz >/dev/null 2>&1 && break; sleep 0.5; done
          q -fsS http://app/healthz | grep -q ok
          q -fsS http://app/api/ping | grep -q '"pong":true'
          q -fsS http://app/ | grep -q '<!DOCTYPE html>'
          timeout 3 q -sN http://app/api/events | grep -q 'event: tick'
          test -s "${RUNNER_TEMP}/hwn/app.log"

          # ── A ponte com o desktop ──────────────────────────────────────────────────────────
          #
          # O defeito real mora ENTRE duas asserções: a tag é injetada, ninguém serve o arquivo, a
          # página carrega inteira e `vssh` simplesmente não existe — sem erro que ligue uma coisa
          # à outra. Por isso a checagem varre TODAS as tags injetadas e busca cada uma, em vez de
          # nomear a que existia no dia em que foi escrita.
          #
          # A versão anterior exigia que o polyfill de FSA NÃO fosse injetado. Era escopo do
          # template ("olá mundo não toca em arquivo do usuário"), e escopo mudou: ele agora é
          # também a galeria, e a peça de arquivos usa a API padrão do W3C. A propriedade que
          # sobrevive à mudança de escopo é esta: o que se injeta, se serve — e carimbado.
          #
          # Desde a v4 o shim vem do `node_modules`, servido por um `mounts` do static-spa — fora
          # da raiz do bundle por construção. É o mesmo defeito com outra causa possível (o `npm
          # ci` não rodou), e a mesma asserção o pega.
          # ⚠ `<link href>` junto com `<script src>`, e não só os scripts. A biblioteca de UI chega
          # por `injectStyles`, e no wheel Python ela viaja por uma linha de `force-include`: se
          # essa linha faltar, a folha vira 404 e o sintoma no servidor é "o app Python é feio" —
          # que não aponta para arquivo de empacotamento nenhum. Varrer as duas é o que troca esse
          # sintoma por um job vermelho.
          srcs=$(q -fsS http://app/             | grep -oE '<script src="[^"]*"|<link rel="stylesheet" href="[^"]*"'             | sed -E 's/.*="([^"]*)"$//')
          test -n "$srcs"
          for s in $srcs; do
            q -fsS "http://app/${s}" >/dev/null \
              || { echo "injetado mas NÃO servido: ${s}"; exit 1; }
            case "$s" in
              *\?v=*) ;;
              *) echo "injetado sem carimbo de conteúdo: ${s} — uma reinstalação serviria a versão velha"; exit 1 ;;
            esac
          done
          echo "$srcs" | grep -q 'vssh-app-shim.js'
          echo "$srcs" | grep -q 'galeria.js'
          q -fsS http://app/_vssh/vssh-app-shim.js | grep -q 'window.vssh'

          # ── A galeria: um backend, N janelas ───────────────────────────────────────────────
          #
          # Duas conexões, e quem incrementa NÃO é quem escuta: é essa assimetria que a peça
          # afirma. Sem a difusão, cada janela veria só o próprio clique — e o smoke passaria se
          # medisse a resposta do POST em vez do stream.
          ( timeout 5 q -sN http://app/api/events > "${RUNNER_TEMP}/sse.txt" & )
          sleep 1
          q -fsS -X POST http://app/api/estado/incrementar >/dev/null
          sleep 1
          grep -q '"contador":1' "${RUNNER_TEMP}/sse.txt" \
            || { echo "a mudança de estado não chegou a quem não clicou"; exit 1; }
          q -fsS http://app/api/estado | grep -q '"contador":1'

  # O MESMO roteiro do smoke acima, no outro runtime. Ele existe porque a promessa "os dois
  # templates são o mesmo app" só vale enquanto os dois SOBEM — e a última vez que ninguém mediu
  # isso, o template Python passou duas majors lendo uma variável que já não existia, morrendo com
  # `KeyError` antes de escutar. As guardas de paridade comparam texto; este passo executa.
  smoke-template-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # As libs vêm da ÁRVORE DE TRABALHO, e não da tag publicada — mesma razão do smoke Node: o
      # smoke existe para provar que o que está NESTE commit sobe. Instalar `@v4` faria o CI
      # validar a versão já publicada e passar verde sobre uma quebra recém-introduzida.
      #
      # `--target vendor/py` é literalmente o que o `installCommand` do manifesto faz no servidor,
      # e é o que o `backend/main.py` põe no `sys.path`.
      - name: Libs do template = esta árvore
        run: python3 -m pip install --quiet --no-cache-dir --target vendor/py "${GITHUB_WORKSPACE}"
        working-directory: templates/hello-vssh-app

      - name: Smoke do template Python
        run: |
          cd templates/hello-vssh-app
          SOCK="${RUNNER_TEMP}/hwp.sock"
          # Um SCRIPT, e não uma função de shell: `timeout` faz `exec` no que recebe, então ele
          # enxerga o PATH e não enxerga função nenhuma. É a mesma armadilha documentada no smoke
          # do Node, e ela derrubou aquele job por quatro commits.
          printf '#!/bin/sh\nexec curl --unix-socket "%s" "$@"\n' "${SOCK}" > "${RUNNER_TEMP}/q"
          chmod +x "${RUNNER_TEMP}/q"
          PATH="${RUNNER_TEMP}:${PATH}"
          VSSH_APP_SOCKET="${SOCK}" VSSH_APP_ID=hello-world \
            VSSH_APP_DATA_DIR="${RUNNER_TEMP}/hwp" python3 backend/main.py &
          for i in $(seq 1 20); do q -fsS http://app/healthz >/dev/null 2>&1 && break; sleep 0.5; done
          q -fsS http://app/healthz | grep -q ok
          q -fsS http://app/api/ping | grep -q '"pong":true'
          q -fsS http://app/ | grep -q '<!DOCTYPE html>'
          timeout 3 q -sN http://app/api/events | grep -q 'event: tick'
          test -s "${RUNNER_TEMP}/hwp/app.log"

          # ── A ponte com o desktop ──────────────────────────────────────────────────────────
          #
          # O defeito real mora ENTRE duas asserções: a tag é injetada, ninguém serve o arquivo, a
          # página carrega inteira e `vssh` simplesmente não existe. Aqui ele tem uma causa a mais
          # que no Node: as libs de navegador viajam DENTRO do wheel (o `force-include` do
          # pyproject), e um empacotamento que as deixasse de fora só apareceria assim.
          # ⚠ `<link href>` junto com `<script src>`, e não só os scripts. A biblioteca de UI chega
          # por `injectStyles`, e no wheel Python ela viaja por uma linha de `force-include`: se
          # essa linha faltar, a folha vira 404 e o sintoma no servidor é "o app Python é feio" —
          # que não aponta para arquivo de empacotamento nenhum. Varrer as duas é o que troca esse
          # sintoma por um job vermelho.
          srcs=$(q -fsS http://app/             | grep -oE '<script src="[^"]*"|<link rel="stylesheet" href="[^"]*"'             | sed -E 's/.*="([^"]*)"$//')
          test -n "$srcs"
          for s in $srcs; do
            q -fsS "http://app/${s}" >/dev/null \
              || { echo "injetado mas NÃO servido: ${s}"; exit 1; }
            case "$s" in
              *\?v=*) ;;
              *) echo "injetado sem carimbo de conteúdo: ${s} — uma reinstalação serviria a versão velha"; exit 1 ;;
            esac
          done
          echo "$srcs" | grep -q 'vssh-app-shim.js'
          echo "$srcs" | grep -q 'galeria.js'
          q -fsS http://app/_vssh/vssh-app-shim.js | grep -q 'window.vssh'

          # ── A galeria: um backend, N janelas ───────────────────────────────────────────────
          ( timeout 5 q -sN http://app/api/events > "${RUNNER_TEMP}/sse.txt" & )
          sleep 1
          q -fsS -X POST http://app/api/estado/incrementar >/dev/null
          sleep 1
          grep -q '"contador":1' "${RUNNER_TEMP}/sse.txt" \
            || { echo "a mudança de estado não chegou a quem não clicou"; exit 1; }
          q -fsS http://app/api/estado | grep -q '"contador":1'

          # ── O filesystem privado, e o confinamento ─────────────────────────────────────────
          #
          # A fuga de raiz é medida no smoke, e não só na bancada: aqui ela passa pelo servidor
          # inteiro (URL, parse, handler), que é onde um `..` decodificado cedo demais escaparia.
          q -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"op":"write-file","path":"n.txt","content":"oi"}' http://app/api/privado | grep -q '"ok":true'
          q -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"op":"read-file","path":"n.txt"}' http://app/api/privado | grep -q '"content":"oi"'
          q -s -X POST -H 'Content-Type: application/json' \
            -d '{"op":"read-file","path":"../../../../etc/passwd"}' http://app/api/privado | grep -q 'EACCES'

          # ── A bandeja pelo BACKEND ─────────────────────────────────────────────────────────
          q -fsS -X POST http://app/api/bandeja | grep -q '"ok":true'
          test -s "${RUNNER_TEMP}/hwp/../tray.json" || { echo "o tray.json não foi escrito"; exit 1; }
