<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hello World</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f5f7; color: #222; }
  h1 { font-size: 1.3rem; margin-top: 0; }
  button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  pre { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Hello World (app pseudo-nativo VSSH)</h1>
  <p>Este HTML é servido pelo backend Python do próprio app, proxied pelo portal.</p>
  <button id="ping">Ping backend</button>
  <pre id="result">(clique em "Ping backend")</pre>
  <script>
    document.getElementById('ping').addEventListener('click', async () => {
      const out = document.getElementById('result');
      out.textContent = 'aguardando...';
      try {
        // fetch relativo: funciona sem alteração sob /<serverId>/proxy/app/hello-world/
        const resp = await fetch('api/ping');
        const data = await resp.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = 'erro: ' + e.message;
      }
    });
  </script>
</body>
</html>
