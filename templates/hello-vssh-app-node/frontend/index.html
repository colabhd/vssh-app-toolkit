<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World (Node)</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 2rem;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; gap: 1rem; align-items: flex-start;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    button {
      font: inherit; padding: .5rem 1rem; border-radius: 6px;
      border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
    }
    pre {
      margin: 0; padding: .75rem 1rem; border-radius: 6px; align-self: stretch;
      background: rgba(127,127,127,.15); overflow-x: auto; min-height: 1.5em;
    }
  </style>
</head>
<body>
  <h1>Hello World — vssh-app (Node)</h1>
  <p>Frontend servido pelo próprio backend, através do proxy do portal.</p>

  <button id="ping">Chamar api/ping</button>
  <pre id="out">—</pre>

  <button id="sub">Assinar api/events (SSE)</button>
  <pre id="events">—</pre>

  <h2 style="margin:1rem 0 0;font-size:1.1rem">A ponte com o desktop</h2>
  <p style="margin:0">
    <code>vssh</code> vem do <code>vssh-app-shim.js</code>, injetado pelo <code>static-spa</code> —
    não há tag <code>&lt;script&gt;</code> para ele neste arquivo.
  </p>

  <button id="notify">vssh.notify</button>
  <button id="confirm">vssh.dialog.confirm</button>
  <pre id="bridge">—</pre>

  <script>
    // URLs RELATIVAS, sempre: o app é servido sob /<serverId>/proxy/app/<id>/, então uma barra no
    // começo apontaria para a raiz do portal, não para o app.
    const out = document.getElementById('out');
    document.getElementById('ping').addEventListener('click', async () => {
      out.textContent = 'chamando...';
      try {
        const r = await fetch('api/ping');
        out.textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) {
        out.textContent = 'erro: ' + e.message;
      }
    });

    // SSE pelo mesmo caminho relativo. Se os eventos chegarem em lote em vez de um a um, o
    // problema é bufferização na borda — ver lib/node/sse.js.
    const ev = document.getElementById('events');
    document.getElementById('sub').addEventListener('click', (e) => {
      e.target.disabled = true;
      const src = new EventSource('api/events');
      src.addEventListener('tick', (m) => { ev.textContent = m.data; });
      src.onerror = () => { ev.textContent = 'conexão SSE caiu'; src.close(); e.target.disabled = false; };
    });

    // ─── A ponte com o desktop ────────────────────────────────────────────────
    //
    // `vssh` é global porque o static-spa injetou a tag do shim antes do </head> (ver
    // backend/server.js). Se ele não existir, a lib não está sendo SERVIDA — quase sempre porque
    // foi vendorizada fora da raiz do frontend. É a falha que mais custa tempo, então o template
    // a nomeia em vez de deixar um TypeError solto.
    const br = document.getElementById('bridge');
    if (typeof vssh === 'undefined') {
      br.textContent = 'vssh ausente: o shim não foi servido. Confira injectScripts em '
                     + 'backend/server.js e se frontend/vendor/vssh/web/vssh-app-shim.js existe.';
    } else {
      // `vssh.inDesktop` é síncrono e responde a pergunta mais simples: estou dentro do desktop
      // VSSH ou rodando solto? Fora dele NADA disto lança — cada função degrada para o
      // equivalente do navegador. É por isso que dá para desenvolver o app inteiro sem servidor.
      br.textContent = vssh.inDesktop
        ? 'dentro do desktop VSSH — diálogos e toasts são os do shell'
        : 'fora do desktop — o shim degrada para alert/confirm do navegador';

      document.getElementById('notify').addEventListener('click', () => {
        vssh.notify('Round-trip concluído', { title: 'Hello World', level: 'success' });
      });

      document.getElementById('confirm').addEventListener('click', async () => {
        const ok = await vssh.dialog.confirm('Isto veio do desktop, não do navegador. Confirma?');
        br.textContent = 'confirm devolveu: ' + ok;
      });
    }
  </script>
</body>
</html>
